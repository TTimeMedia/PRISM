<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Prism banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@500&display=swap" rel="stylesheet" />
<style>
  :root { --navy: #14213a; --navy-2: #1b2c4c; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 2622px; height: 1475px; overflow: hidden; background: var(--navy); }
  .stage {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    background:
      radial-gradient(60% 70% at 18% 20%, rgba(91, 207, 251, 0.35), transparent 60%),
      radial-gradient(55% 65% at 85% 15%, rgba(185, 138, 240, 0.38), transparent 60%),
      radial-gradient(60% 60% at 70% 95%, rgba(244, 164, 196, 0.30), transparent 60%),
      radial-gradient(50% 60% at 25% 95%, rgba(80, 200, 170, 0.25), transparent 60%),
      linear-gradient(160deg, var(--navy-2), var(--navy));
  }
  .phones { position: absolute; inset: 0; }
  .phone {
    position: absolute; width: 470px; height: 1022px; border-radius: 76px;
    background: #0b0b0f; padding: 16px;
    box-shadow: 0 60px 120px rgba(0, 0, 0, 0.45), 0 0 0 2px rgba(255, 255, 255, 0.12) inset;
  }
  .phone img { width: 100%; height: 100%; border-radius: 62px; object-fit: cover; object-position: top; display: block; }
  .phone::after {
    content: ''; position: absolute; top: 34px; left: 50%; transform: translateX(-50%);
    width: 150px; height: 42px; border-radius: 21px; background: #0b0b0f;
  }
  .p1 { left: 50%; top: 240px; transform: translateX(-152%) rotate(-6deg); }
  .p2 { left: 50%; top: 180px; transform: translateX(-50%); z-index: 2; }
  .p3 { left: 50%; top: 240px; transform: translateX(52%) rotate(6deg); }
  .copy { display: none; }
  body.search .phones { transform: translateX(420px) scale(0.92); transform-origin: center; }
  body.search .copy {
    display: flex; flex-direction: column; gap: 40px;
    position: absolute; left: 210px; top: 50%; transform: translateY(-50%); width: 900px; color: #fff;
  }
  .brand { display: flex; align-items: center; gap: 36px; }
  .brand img { width: 170px; height: 170px; border-radius: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.35); }
  .brand span { font: 700 132px/1 'Sora', sans-serif; letter-spacing: -2px; }
  .tagline { font: 700 104px/1.08 'Sora', sans-serif; letter-spacing: -2px; }
  .sub { font: 500 46px/1.35 'Inter', sans-serif; color: rgba(255,255,255,0.78); max-width: 820px; }
</style>
</head>
<body>
<div class="stage">
  <div class="copy">
    <div class="brand"><img src="icon.png" alt="" /><span>Prism</span></div>
    <div class="tagline">Your journey.<br />Your way.</div>
    <div class="sub">Private care and journal: doses, appointments, milestones, all in one place.</div>
  </div>
  <div class="phones">
    <div class="phone p1"><img src="iphone-3-journey.png" alt="" /></div>
    <div class="phone p2"><img src="iphone-1-today.png" alt="" /></div>
    <div class="phone p3"><img src="iphone-7-eli-today.png" alt="" /></div>
  </div>
</div>
<script>
  if (location.hash === '#search') document.body.classList.add('search');
</script>
</body>
</html>
